<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Game Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }
    .ad-slot {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 12px 0;
      overflow: hidden;
    }
    .game-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 15px 0;
      max-width: 900px;
    }
    .game-btn {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: background 0.2s;
    }
    .game-btn:hover, .game-btn.active {
      background-color: #1d4ed8;
      outline: 2px solid #60a5fa;
    }
    .arcade-stage {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      max-width: 1200px;
      width: 100%;
    }
    .game-wrapper {
      background: #000;
      border: 2px solid #333;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    iframe#gameFrame {
      width: 720px;
      height: 480px;
      max-width: 100%;
      border: none;
    }
    .sidebar-ads {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }
    .bottom-ads {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
    @media (max-width: 768px) {
      iframe#gameFrame {
        width: 100%;
        height: 320px;
      }
    }
  </style>
</head>
<body>

  <!-- TOP LEADERBOARD AD (728x90) -->
  <div class="ad-slot">
    <script>
      atOptions = {
        'key' : '09152db8e3648d6768323201f9a46cc6',
        'format' : 'iframe',
        'height' : 90,
        'width' : 728,
        'params' : {}
      };
    </script>
    <script src="https://bicea.org/22/09152db8e3648d6768323201f9a46cc6"></script>
  </div>

  <!-- GAME SELECTOR MENU -->
  <div class="game-nav">
    <button class="game-btn active" onclick="loadGame('https://play.gamepix.com/tappy-flappy-pirate-king/embed?sid=M2I87', this)">Tappy Flappy Pirate King</button>
    <button class="game-btn" onclick="loadGame('https://play.gamepix.com/ultimate-speed-racer-road-king/embed?sid=M2I87', this)">Ultimate Speed Racer</button>
    <button class="game-btn" onclick="loadGame('https://play.gamepix.com/web-slinger-insect-capture-challenge/embed?sid=M2I87', this)">Web Slinger Challenge</button>
    <button class="game-btn" onclick="loadGame('https://play.gamepix.com/santa-s-rush-christmas-adventure/embed?sid=M2I87', this)">Santa's Rush Adventure</button>
  </div>

  <!-- MAIN STAGE: GAME + SIDEBAR ADS -->
  <div class="arcade-stage">
    
    <!-- LEFT SKYSCRAPER AD (160x300) -->
    <div class="sidebar-ads">
      <div class="ad-slot">
        <script>
          atOptions = {
            'key' : '9684f1cac9f37a924977ef6e3830217a',
            'format' : 'iframe',
            'height' : 300,
            'width' : 160,
            'params' : {}
          };
        </script>
        <script src="https://bicea.org/22/9684f1cac9f37a924977ef6e3830217a"></script>
      </div>
    </div>

    <!-- GAME CONTAINER -->
    <div class="game-wrapper">
      <iframe id="gameFrame" src="https://play.gamepix.com/tappy-flappy-pirate-king/embed?sid=M2I87" width="720" height="480" frameborder="0" scrolling="no" allowfullscreen></iframe>
      
      <!-- UNDER-GAME BANNER AD (468x60) -->
      <div class="ad-slot">
        <script>
          atOptions = {
            'key' : '52c56d9980b4250dc55eaa8b7bd2dd44',
            'format' : 'iframe',
            'height' : 60,
            'width' : 468,
            'params' : {}
          };
        </script>
        <script src="https://bicea.org/22/52c56d9980b4250dc55eaa8b7bd2dd44"></script>
      </div>
    </div>

    <!-- RIGHT RECTANGLE AD (300x250) -->
    <div class="sidebar-ads">
      <div class="ad-slot">
        <script>
          atOptions = {
            'key' : 'c0d4e6e93e8cf76c24dcd887bdfe783f',
            'format' : 'iframe',
            'height' : 250,
            'width' : 300,
            'params' : {}
          };
        </script>
        <script src="https://bicea.org/22/c0d4e6e93e8cf76c24dcd887bdfe783f"></script>
      </div>
    </div>

  </div>

  <!-- MOBILE / FOOTER BANNER AD (320x50) -->
  <div class="bottom-ads">
    <div class="ad-slot">
      <script>
        atOptions = {
          'key' : '805ff83aa4d1671d83801aec1b02473f',
          'format' : 'iframe',
          'height' : 50,
          'width' : 320,
          'params' : {}
        };
      </script>
      <script src="https://bicea.org/22/805ff83aa4d1671d83801aec1b02473f"></script>
    </div>
  </div>

  <!-- SOCIAL BAR / POPUNDER SCRIPT -->
  <script data-cfasync="false" src="https://bicea.org/14/856d14bcf4354024ca2af1801e3a95f1"></script>

  <!-- GAME SWITCHER SCRIPT -->
  <script>
    function loadGame(url, btn) {
      document.getElementById('gameFrame').src = url;
      document.querySelectorAll('.game-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>

</body>
</html>
